name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-quality:
    name: Build, testes e qualidade
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore ElsEvo.csproj

      - name: Compilar com avisos como erro
        run: dotnet build ElsEvo.csproj --configuration Release --no-restore --warnaserror

      - name: Rodar testes
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Recurse -Filter '*Tests.csproj' -File
          if ($testProjects.Count -eq 0) {
            Write-Host 'Nenhum projeto de testes foi encontrado; etapa mantida pronta para quando os testes forem adicionados.'
            "testes=nao-configurados" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          foreach ($project in $testProjects) {
            dotnet test $project.FullName --configuration Release --no-restore
          }

      - name: Verificar vulnerabilidades NuGet
        shell: pwsh
        run: |
          $auditOutput = dotnet list ElsEvo.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output $auditOutput
            throw 'A auditoria de dependências NuGet falhou.'
          }

          Write-Output $auditOutput
          if ($auditOutput -match 'has the following vulnerable packages') {
            Write-Error 'Foram encontradas vulnerabilidades nas dependências NuGet.'
          }

      - name: Publicar resumo
        if: always()
        shell: pwsh
        run: |
          "## CI" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Execução: ``${{ github.run_number }}``" >> $env:GITHUB_STEP_SUMMARY

  notify:
    name: Notificar resultado
    needs: build-test-quality
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enviar webhook opcional
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULTADO: ${{ needs.build-test-quality.result }}
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl --fail-with-body -H 'Content-Type: application/json' \
            -d "{\"content\":\"CI ElsEvo: ${RESULTADO} - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Registrar notificação padrão
        run: |
          echo "Resultado da CI: ${{ needs.build-test-quality.result }}. O GitHub também notificará os participantes conforme as preferências do repositório."